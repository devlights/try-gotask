# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  default:
    cmds:
      - task: build
      - task: run
  build:
    cmds:
      - go build -o app main.go
    sources:
      - ./*.go
    generates:
      - app{{exeExt}}
  run:
    cmds:
      - ./app{{exeExt}}
